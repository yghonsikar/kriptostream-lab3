name: JFrog OIDC Build and Publish

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test raw OIDC token exchange
        run: |
          ID_TOKEN=$(curl -sLS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=krypto-data-github-oidc" | jq -r .value)

          echo "Requesting token exchange..."
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST "https://trialqy9988.jfrog.io/access/api/v1/oidc/token" \
            -H "Content-Type: application/json" \
            -d "{\"grant_type\":\"urn:ietf:params:oauth:grant-type:token-exchange\",\"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\",\"subject_token\":\"${ID_TOKEN}\",\"provider_name\":\"krypto-data-github-oidc\"}"

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://trialqy9988.jfrog.io
        with:
          oidc-provider-name: krypto-data-github-oidc
          oidc-audience: krypto-data-github-oidc

      - name: Create dummy artifact
        run: echo "DLT Manifest - Build $(date)" > dlt-manifest.txt

      - name: Upload artifact to Artifactory
        run: |
          jf rt upload dlt-manifest.txt krypto-data-npm-dev-local/dlt-manifest.txt --project=krypto-data --build-name=krypto-build --build-number=${{ github.run_number }}

      - name: Collect environment variables
        run: jf rt build-collect-env krypto-build ${{ github.run_number }} --project=krypto-data

      - name: Collect Git metadata
        run: jf rt build-add-git krypto-build ${{ github.run_number }} --project=krypto-data

      - name: Publish Build Info
        run: jf rt build-publish krypto-build ${{ github.run_number }} --project=krypto-data
